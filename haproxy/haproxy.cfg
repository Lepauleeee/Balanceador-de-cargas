global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout check   5s

# ---------- Dashboard de estadisticas ----------
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s

# ---------- Balanceo HTTP ----------
frontend http_front
    bind *:8080
    mode http
    default_backend http_back

backend http_back
    mode http
    balance source
    option httpchk GET /
    http-check expect status 200
    server web1 web1:80 check
    server web2 web2:80 check

# ---------- Balanceo MySQL (modo TCP) ----------
frontend mysql_front
    bind *:3306
    mode tcp
    default_backend mysql_back

backend mysql_back
    mode tcp
    balance roundrobin
    server mysql_primary mysql_primary:3306 check
